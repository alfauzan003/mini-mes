services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes
      POSTGRES_DB: mini_mes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
